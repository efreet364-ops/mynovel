spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:}
      chat:
        options:
          model: qwen-plus
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never


  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/novel?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123}

  data:
    # Redis
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}

  # Spring AMQP 配置
  amqp:
    # 是否开启 Spring AMQP：true-开启 false-不开启
    enabled: ${AMQP_ENABLED:true}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/novel}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  # elasticsearch
  elasticsearch:
    # 是否开启 Elasticsearch 搜索引擎功能：true-开启 false-不开启
    enabled: ${ES_ENABLED:true}
    uris: ${ES_URIS:http://localhost:9200}

# searchApi
search-api:
  api-key: ${SEARCH_API_KEY:}
  url: ${SEARCH_API_URL:https://www.searchapi.io/api/v1/search}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:aud}
  cny-to-aud-rate: ${STRIPE_CNY_TO_AUD_RATE:0.21}
  min-amount-cny: ${STRIPE_MIN_AMOUNT_CNY:1}
  max-amount-cny: ${STRIPE_MAX_AMOUNT_CNY:500}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:8081/#/user/recharge/result}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8081/#/user/recharge/result}


jwt:
  secret: ${JWT_SECRET:dev-only-change-me-32-bytes-secret}
  access-token-expire: ${JWT_ACCESS_TOKEN_EXPIRE:1800}
  refresh-token-expire: ${JWT_REFRESH_TOKEN_EXPIRE:604800}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${ALIYUN_OSS_REGION:cn-beijing}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:my-awesome-novel}
    agent-bucket-name: ${ALIYUN_OSS_AGENT_BUCKET_NAME:mynovel-agent-gen}
    agent-url-expire-days: ${ALIYUN_OSS_AGENT_URL_EXPIRE_DAYS:7}
    agent-prefix: ${ALIYUN_OSS_AGENT_PREFIX:agent/pdf/}

app:
  file-save-dir: ${APP_FILE_SAVE_DIR:${java.io.tmpdir}/mynovel}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.50.*:*}

logging:
  level:
    org.springframework.ai: ${SPRING_AI_LOG_LEVEL:DEBUG}
